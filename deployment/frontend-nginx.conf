server {
    listen 80;
    server_name _;
    root /var/www/raithu-connect;
    index index.html;

    # Replace BACKEND_PRIVATE_IP with the private IPv4 address of Server 2.
    location /api/ {
        proxy_pass http://BACKEND_PRIVATE_IP:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass http://BACKEND_PRIVATE_IP:4000/health;
    }
    location /socket.io/ {
        proxy_pass http://BACKEND_PRIVATE_IP:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}